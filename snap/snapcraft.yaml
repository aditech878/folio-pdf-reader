name: folio-pdf-reader
title: Folio PDF Reader
base: core22
version: '0.2.1'
license: AGPL-3.0-or-later
donation: https://buymeacoffee.com/aadityabanwari
website: https://github.com/aditech878/folio-pdf-reader
source-code: https://github.com/aditech878/folio-pdf-reader
issues: https://github.com/aditech878/folio-pdf-reader/issues
summary: A focused reader for your PDFs
description: |
  Folio is a desktop PDF reader with continuous pages, text search,
  thumbnails, document outlines, zoom, rotation, night colors, tabs,
  and printing. Documents stay on your computer.
grade: devel
confinement: strict
icon: assets/folio.png
assumes: [snapd2.55]

apps:
  folio-pdf-reader:
    command: bin/folio-pdf-reader
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - cups
      - network

parts:
  folio:
    plugin: python
    source: .
    stage-packages:
      - libgl1
      - libegl1
      - libxcb-xinerama0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libxkbcommon-x11-0
